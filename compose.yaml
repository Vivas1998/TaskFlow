name: taskflow

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www/html
    command: ["sh", "/usr/local/bin/taskflow-start"]
    ports:
      - "${TASKFLOW_APP_PORT:-8000}:8000"
    volumes:
      - ./web:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - taskflow

  node:
    image: node:24.13.0-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "${TASKFLOW_VITE_PORT:-5173}:5173"
    volumes:
      - ./web:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - taskflow

  mysql:
    image: mysql:8.4
    ports:
      - "${TASKFLOW_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow_dev
      MYSQL_ROOT_PASSWORD: root_dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskflow

  mysql_test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskflow_test
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow_test
      MYSQL_ROOT_PASSWORD: root_test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_test --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/mysql
    networks:
      - taskflow

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${TASKFLOW_MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
    networks:
      - taskflow

networks:
  taskflow:

volumes:
  composer_vendor:
  mysql_data:
  node_modules:
